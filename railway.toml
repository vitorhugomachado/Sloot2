# Deploy único: Vite (frontend) + Express (API) + Postgres
# https://docs.railway.com/reference/config-as-code

[build]
# Dockerfile evita Nixpacks/Nix (falha comum: "No space left on device" no passo nix-env)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Mesmo comando do Dockerfile CMD (runner não inclui package.json da raiz)
preDeployCommand = ["node server/predeploy.js"]
startCommand = "node server/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
