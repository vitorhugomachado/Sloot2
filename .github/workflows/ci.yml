name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: sloot2_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d sloot2_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sloot2_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sloot2_test
      JWT_SECRET: ci-only-secret-not-for-production
      NODE_ENV: test
      STAGING_BOOTSTRAP: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node server/predeploy.js
      - run: npm run db:seed
      - run: npm run test:run
      - run: npm run build
      - run: docker build --tag slooti-ci .
